<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>My Study Portal</title>

<style>
body{
    margin:0;
    background:#0d1117;
    color:#f0f6fc;
    font-family:Arial,sans-serif;
}

.wrap{
    max-width:1000px;
    margin:auto;
    padding:50px 20px;
}

h1{
    font-size:38px;
    margin-bottom:5px;
}

.subtitle{
    color:#8b949e;
    margin-bottom:35px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    display:block;
    background:#161b22;
    border:1px solid #30363d;
    border-radius:14px;
    padding:25px;
    color:white;
    text-decoration:none;
}

.card:hover{
    border-color:#2f81f7;
    transform:translateY(-3px);
}

.icon{
    font-size:36px;
}

.card h2{
    margin:12px 0 8px;
}

.card p{
    color:#8b949e;
    line-height:1.5;
}
</style>
</head>

<body>

<div class="wrap">

<h1>📚 My Study Portal</h1>

<div class="subtitle">
My centralized technical knowledge library
</div>

<div class="grid">

<a class="card" href="linux-commands/">
    <div class="icon">🐧</div>
    <h2>Linux Commands</h2>
    <p>
    Linux administration, commands,
    troubleshooting and examples.
    </p>
</a>

</div>

</div>

</body>
</html>
